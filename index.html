<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F7F7F5" />
  <meta name="color-scheme" content="light dark" />
  <!-- Apply appearance before modules and authentication can show a loader. -->
  <script>
    try {
      const theme = localStorage.getItem('omniprep_theme') === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0c0d0f' : '#F7F7F5';
    } catch { document.documentElement.dataset.theme = 'light'; }
  </script>
  <style>
    html { background: #F7F7F5; }
    html[data-theme="dark"] { background: #0c0d0f; color-scheme: dark; }
    body { margin: 0; background: inherit; }
  </style>
  <meta name="description"
    content="Cognition: High-performance exam preparation for IELTS Academic. Timed mock exams, AI scoring, and comprehensive analytics." />
  <title>Cognition</title>

  <!-- Favicon — Cognition Official Logo -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="mask-icon" href="/favicon.svg" color="#D97757" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
